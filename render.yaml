services:
  - type: web
    name: vs-plastic-erp
    runtime: node
    rootDir: .gemini/antigravity/scratch/vs-plastic-erp
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: '1'
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '4000'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
